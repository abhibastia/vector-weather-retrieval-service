command:
  - "python"
  - "app.py"

env:
  # Lakebase connection. Only the scope/key names live here - the connection URL
  # itself stays in the Databricks secret and is never committed. The app's
  # service principal must be granted READ on this scope
  # (see README_WEATHER.md, "Grant the app SP secret access").
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"

  - name: WEATHER_DOCUMENTS_TABLE
    value: "weather_documents"
  - name: WEATHER_EMBEDDINGS_TABLE
    value: "weather_embeddings"

  # api.weather.gov requires a descriptive User-Agent with contact info and
  # returns 403 without one. SET THIS to your own contact address before
  # deploying - and prefer an address you are willing to publish, since this
  # file is committed to the Git folder the app deploys from.
  - name: NWS_API_BASE_URL
    value: "https://api.weather.gov"
  - name: NWS_USER_AGENT
    value: "vector-weather-retrieval-service (you@example.com)"

  # Must match the model used by the ingestion job. 384 dimensions.
  - name: EMBEDDING_MODEL
    value: "sentence-transformers/all-MiniLM-L6-v2"

  # App containers ship a read-only filesystem outside /tmp; HuggingFace will
  # fail to cache the model anywhere else.
  - name: HF_HOME
    value: "/tmp/.cache/huggingface"
  - name: SENTENCE_TRANSFORMERS_HOME
    value: "/tmp/.cache/huggingface"

  # Foundation model endpoint backing POST /weather/answer (the RAG bonus).
  - name: RAG_CHAT_ENDPOINT
    value: "databricks-gpt-oss-20b"
